<!DOCTYPE html>
<html>
<head>
    <title>Observatorio Simple</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; }
        .popup-content {
            font-family: Arial, sans-serif;
            line-height: 1.4;
        }
        .popup-header {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            padding: 10px;
            margin: -10px -10px 10px -10px;
            border-radius: 4px 4px 0 0;
        }
        .popup-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
    // Función para generar popup del Banco Agrario
    function generarPopupBancoAgrario(props, bounds) {
        let areaInfo = '';
        if (bounds) {
            const area = (bounds.getNorth() - bounds.getSouth()) * (bounds.getEast() - bounds.getWest());
            areaInfo = `<div><strong>📐 Área estimada:</strong> ${(area * 111000).toFixed(0)} m²</div>`;
        }

        const center = bounds ? bounds.getCenter() : null;
        const coordenadas = center ? `${center.lat.toFixed(6)}, ${center.lng.toFixed(6)}` : 'No disponible';

        return `
            <div class="popup-content">
                <div class="popup-header">
                    <h3 class="popup-title">🏛️ Banco Agrario</h3>
                    <div>${props.name || 'Sucursal Rural'}</div>
                </div>
                <div>
                    ${areaInfo}
                    <div><strong>📍 Coordenadas:</strong> ${coordenadas}</div>
                    <div><strong>🏦 Información:</strong><br>
                    Oficina Rural del Banco Agrario de Colombia<br>
                    <em>Datos obtenidos del archivo KMZ oficial</em></div>
                </div>
            </div>
        `;
    }

    // Crear mapa
    const map = L.map('map').setView([4.711, -74.072], 6);

    // Agregar capa base
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '© ESRI'
    }).addTo(map);

    // Cargar KMZ del Banco Agrario
    fetch('/api/kmz/banco-agrario')
        .then(response => response.text())
        .then(kmlContent => {
            console.log('KML recibido:', kmlContent.length, 'caracteres');

            const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
            const kmlUrl = URL.createObjectURL(blob);

            const kmlLayer = omnivore.kml(kmlUrl)
                .on('ready', function() {
                    console.log('KML cargado, capas:', this.getLayers().length);

                    this.eachLayer(function(layer) {
                        if (layer.feature && layer.feature.properties) {
                            console.log('Configurando click en:', layer.feature.properties.name);

                            layer.on('click', function() {
                                const popupContent = generarPopupBancoAgrario(layer.feature.properties, layer.getBounds ? layer.getBounds() : null);
                                layer.bindPopup(popupContent, {
                                    maxWidth: 450,
                                    minWidth: 300
                                }).openPopup();
                            });

                            // Estilo verde para los polígonos
                            if (layer.setStyle) {
                                layer.setStyle({
                                    color: '#10b981',
                                    weight: 2,
                                    opacity: 0.8,
                                    fillColor: '#10b981',
                                    fillOpacity: 0.3
                                });
                            }
                        }
                    });
                })
                .on('error', function(e) {
                    console.error('Error cargando KML:', e);
                })
                .addTo(map);

            URL.revokeObjectURL(kmlUrl);
        })
        .catch(error => {
            console.error('Error:', error);
        });
    </script>
</body>
</html>
