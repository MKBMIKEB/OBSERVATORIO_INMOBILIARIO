<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con degradado -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Círculo de fondo -->
  <circle cx="96" cy="96" r="90" fill="url(#grad1)"/>

  <!-- Icono de edificio/casa -->
  <g transform="translate(96, 96)">
    <!-- Casa principal -->
    <path d="M-40,-30 L0,-55 L40,-30 L40,40 L-40,40 Z"
          fill="white"
          stroke="white"
          stroke-width="2"/>

    <!-- Techo -->
    <path d="M-45,-30 L0,-60 L45,-30"
          fill="none"
          stroke="white"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- Ventanas -->
    <rect x="-25" y="-10" width="15" height="15" fill="#10b981"/>
    <rect x="10" y="-10" width="15" height="15" fill="#10b981"/>

    <!-- Puerta -->
    <rect x="-10" y="10" width="20" height="30" fill="#10b981"/>
    <circle cx="5" cy="25" r="2" fill="white"/>
  </g>

  <!-- Texto Observatorio -->
  <text x="96" y="175"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="white"
        text-anchor="middle">OBSERVATORIO</text>
</svg>
