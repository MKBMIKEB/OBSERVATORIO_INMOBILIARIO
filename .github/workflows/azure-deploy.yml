name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: observatorio-inm
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🧪 Run tests (opcional)
      run: npm test --if-present

    - name: 🏗️ Build application (si es necesario)
      run: npm run build --if-present

    - name: 📁 Prepare deployment package
      run: |
        # Crear archivo ZIP con los archivos necesarios
        zip -r deploy.zip . \
          -x "*.git*" \
          -x "node_modules/*" \
          -x "*.log" \
          -x "*.md" \
          -x ".env*" \
          -x "uploads/*" \
          -x "*.ps1"

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deploy.zip

    - name: ✅ Deployment successful
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🌐 URL: https://observatorio-inm-hwfzb3dheeeavcrdm.brazilsouth-01.azurewebsites.net"
