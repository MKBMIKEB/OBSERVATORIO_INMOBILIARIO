<!DOCTYPE html>
<html>
<head>
    <title>Debug Simple</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
</head>
<body>
    <h1>DEBUG - Solo mapa básico</h1>
    <div id="map" style="height: 400px; border: 2px solid red;"></div>
    <p>Si ves el mapa rojo, Leaflet funciona. Si no, hay problema básico.</p>

    <script>
        console.log('Iniciando debug...');

        try {
            // Mapa súper simple
            const map = L.map('map').setView([4.711, -74.072], 6);
            console.log('Mapa creado:', map);

            // Tile layer simple
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            console.log('Tiles agregados');

            // Marcador de prueba
            L.marker([4.711, -74.072])
                .addTo(map)
                .bindPopup('Bogotá - Si ves esto, el mapa funciona')
                .openPopup();
            console.log('Marcador agregado');

        } catch (error) {
            console.error('ERROR EN DEBUG:', error);
            document.body.innerHTML += '<h2 style="color: red;">ERROR: ' + error.message + '</h2>';
        }
    </script>
</body>
</html>
